name: Build Limon OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y --fix-missing gcc nasm grub-pc-bin grub-common xorriso mtools

      - name: Build
        run: |
          git pull --rebase origin main
          make
          echo "BUILD_NUMBER=$(cat build.no)" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: limon-b${{ env.BUILD_NUMBER }}-${{ env.SHORT_SHA }}
          path: limon_v*.iso
          
      - name: Save Builder Number
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add build.no
          git commit -m "chore: bump build number to b$(cat build.no) [skip ci]"
          git push